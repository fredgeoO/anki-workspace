{{FrontSide}}

<!-- Anki 识别正反面的分割线，不要删 -->
<hr id=answer>

<div class="card">
    <div class="front-wrapper">
        
        <!-- 例句 -->
        <div class="sentence-section">
            {{Sentence HTML}}
        </div>

        <!-- AI 笔记 / 解析内容 -->
        <div class="ai-note">
            {{AINote}}
        </div>

        <!-- 底部来源信息 -->
        <div class="source-info">
            <div>{{Source}}</div>
            <div style="margin-top: 5px;">{{URL}}</div>
        </div>

    </div>
</div>
